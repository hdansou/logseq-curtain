name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose: package.json's packageManager
      # field is the single source, and the action errors out if both are
      # given. It also pins the exact version rather than a major.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build is not the gate; these are. A release that ships a failing
      # type check or a red suite is worse than a late one.
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

      # Everything the plugin needs at runtime, and nothing else.
      - name: Package
        run: |
          mkdir -p release/logseq-curtain
          cp -r dist icon.png package.json README.md NOROBOTS.md LICENSE release/logseq-curtain/
          cd release && zip -r ../logseq-curtain.zip logseq-curtain

      - uses: softprops/action-gh-release@v2
        with:
          files: logseq-curtain.zip
          generate_release_notes: true
