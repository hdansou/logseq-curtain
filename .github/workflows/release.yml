name: Build and Release Logseq Plugin

on:
  push:
    tags: ["v*"]
  # Build the zip without tagging, so the exact artifact can be downloaded and
  # tested before a release exists.
  workflow_dispatch:

permissions:
  contents: write

env:
  # Derived, not hardcoded: survives a repository rename.
  PLUGIN_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No pnpm version here: package.json's packageManager is the single
      # source, and the action errors if both are given.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build is not the gate; these are. A release that ships a failing
      # type check or a red suite is worse than a late one.
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

      - name: Package plugin zip
        run: |
          mkdir "$PLUGIN_NAME"
          cp README.md NOROBOTS.md LICENSE package.json icon.png "$PLUGIN_NAME"
          cp -R dist "$PLUGIN_NAME"
          zip -r "$PLUGIN_NAME.zip" "$PLUGIN_NAME"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-zip
          path: ${{ env.PLUGIN_NAME }}.zip

      - name: Create GitHub release and upload zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.PLUGIN_NAME }}.zip
