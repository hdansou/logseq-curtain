name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

      # Two advisories in this project's history shipped to users inside the
      # bundle rather than staying on a build machine. Failing the build on a
      # moderate is the cheap way to notice the next one.
      - name: Audit
        run: pnpm audit --audit-level=moderate
